name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许手动点击按钮触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. Setup Gradle
      uses: gradle/gradle-build-action@v3 # 核心：自动处理Gradle环境，无需gradlew文件

    - name: 4. Decode Keystore
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks

    - name: 5. Build Release APK
      env:
        KEYSTORE_PATH: release-key.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: gradle assembleRelease --stacktrace # 直接使用全局gradle命令

    - name: 6. Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyApp-Release-APK
        path: app/build/outputs/apk/release/*.apk
