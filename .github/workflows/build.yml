name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许手动点击按钮触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: 3. Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: 4. Decode Keystore
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks
        # 如果你在 build.gradle 里写的路径是 release-key.jks
        # 确保它生成在根目录，或者通过环境变量传递绝对路径

    - name: 5. Build Release APK
      env:
        KEYSTORE_PATH: release-key.jks # 这里的路径对应 build.gradle 里的 System.getenv("KEYSTORE_PATH")
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease --stacktrace

    - name: 6. Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyApp-Release-APK
        path: app/build/outputs/apk/release/*.apk
