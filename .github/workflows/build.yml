name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许手动点击按钮触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    - name: 2. 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 核心修改：使用官方Action自动下载Gradle，不再依赖 gradlew 文件
    - name: 3. 设置 Gradle 环境
      uses: gradle/actions/setup-gradle@v3

    - name: 4. 还原签名证书
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks

    # 核心修改：直接使用全局 gradle 命令，而不是 ./gradlew
    - name: 5. 打包 Release APK
      env:
        KEYSTORE_PATH: release-key.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: gradle assembleRelease --stacktrace

    - name: 6. 上传 APK 安装包
      uses: actions/upload-artifact@v4
      with:
        name: MyApp-Release-APK
        path: app/build/outputs/apk/release/*.apk
